[project]
name = "steam-analysis"
version = "0.1.0"
description = "Coleta de detalhes dos jogos mais bem avaliados da Steam"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "missingno>=0.5.2",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "loguru>=0.7.3",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.6",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
